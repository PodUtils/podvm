# The state of each issue from the record (the owner's ruling "Issues",
# TODO/cli.md T-1919): the reusable workflow of podcrates writes a status
# block into each issue, and closes or opens it to match TODO/github.txt.
#
# The first dry run (run 43775969796, request 438) wrote a block into 291
# issues, closed #395 (open on GitHub, closed in the record), and left
# each issue from outside the team with no label `confirmed`. So the sync
# runs on each push to main and each day; a dispatch is a dry run by
# default (PodUtils/podcrates#194).
name: issue-sync

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print what the sync would change, and change nothing"
        type: boolean
        default: true

jobs:
  issues:
    permissions:
      contents: read
      issues: write
    uses: PodUtils/podcrates/.github/workflows/issue-sync.yml@0ea12df21b3bbcfdc883dee71c824e21aba527d8 # v0.72.0
    with:
      podcrates_ref: v0.72.0
      dry_run: ${{ inputs.dry_run || false }}
