# The tools of a CI job in a detached podvm unit, on a hosted runner.
#
# TODO/gate.md T-1936. Experiment 464 runs a raw `syscall` instruction of a
# dynamic program, Python's `subprocess`, a pty, `uv` and `ruff` in a unit
# of `run -d`, with no flag and on the syscall tier, as the runner's own user
# (no root). Two legs: `restricted` keeps the AppArmor rule of Ubuntu 24.04,
# which gives the user the userland rung only, as on podrunner's hosted
# runners; `userns` lifts it, which gives the namespace rung. Dispatched by
# hand before a release (AGENTS.md, section 9, item 5), and each week.
name: workloads

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

concurrency:
  group: workloads-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workloads:
    name: experiment 464 (${{ matrix.leg }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        leg: [restricted, userns]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: user namespaces for the leg userns
        if: matrix.leg == 'userns'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -Urm true && echo "user and mount namespaces: ok"

      - name: bootstrap
        run: ./scripts/common/bootstrap-env.sh rust cc zig tools

      - name: build podvm
        run: |
          cargo build --release -p podvm-gate --bin podvm-interpose-build
          mkdir -p target/release
          cp target/x86_64-unknown-linux-musl/release/podvm-interpose-build target/release/
          ./target/release/podvm-interpose-build
          cargo build --release -p podvm

      - name: experiment 464
        run: |
          rc=0
          timeout 45m sh experiments/464-workloads.sh || rc=$?
          exit "$rc"

      - name: keep the transcript
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workloads-${{ matrix.leg }}
          path: experiments/results/workloads.txt
          if-no-files-found: warn
