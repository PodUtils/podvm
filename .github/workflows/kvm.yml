# The machine tier's Linux guest under KVM, on a hosted runner.
#
# TODO/machine.md T-1682. The KVM proof ran only on the operator's host, and
# one run there left an emulator that SIGKILL did not remove. A hosted
# runner is the first choice: the job ends with its machine. A udev rule
# gives the job /dev/kvm; experiment 390 boots the pinned Alpine guest with
# `podvm machine ssh` and, with PODVM_390_WANT_KVM=1, requires the run to
# name the kvm accelerator. A job with no /dev/kvm exits 2 at the check,
# before any guest. Dispatched by hand (AGENTS.md, section 9, item 5).
name: kvm

on:
  workflow_dispatch:
    inputs:
      only:
        description: "One job to run (guest, windows, cgroup, nonroot, init, arch or install); empty runs each"
        required: false
        default: ""
      windows:
        description: "The catalog name of the job install (TODO/machine.md T-1867): 2025, 11 or 10"
        required: false
        default: "2025"

permissions:
  contents: read

concurrency:
  group: kvm
  cancel-in-progress: false

jobs:
  guest:
    if: inputs.only == '' || inputs.only == 'guest'
    name: Linux guest under KVM (experiment 390)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: give the job /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle || true
          # The trigger is not always done when settle returns: the node
          # gets the mode directly where it exists.
          [ -e /dev/kvm ] && sudo chmod 0666 /dev/kvm
          ls -l /dev/kvm 2>&1 || true
          grep -cE 'vmx|svm' /proc/cpuinfo || true
          if [ -w /dev/kvm ] && [ -r /dev/kvm ]; then
            ls -l /dev/kvm
          else
            echo "no usable /dev/kvm on this runner: COULD NOT RUN"
            exit 2
          fi

      # 390 needs qemu-system-x86_64 only; the bootstrap's qemu component
      # also asks for qemu-user-static, which the runner image did not
      # install (run 42968325558).
      - name: qemu
        run: |
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 >/dev/null
          qemu-system-x86_64 --version | head -1

      - name: bootstrap
        run: ./scripts/common/bootstrap-env.sh rust cc zig openssh tools vmtools

      # 390 runs from /work and copies its partial evidence to /out, as in
      # the lane that it was written for.
      - name: experiment 390 under KVM
        env:
          PODVM_390_WANT_KVM: "1"
          # The client's diagnosis lands in the transcript of a failed run.
          PODVM_MACHINE_SSH_LOG: DEBUG1
        run: |
          sudo ln -sfn "$GITHUB_WORKSPACE" /work
          sudo mkdir -p /out && sudo chmod 0777 /out
          rc=0
          timeout 45m bash experiments/390-machine-ssh.sh || rc=$?
          cat experiments/results/machine-ssh.txt || true
          # Nothing of the guest may stay after the run.
          if pgrep -a qemu-system; then
            echo "an emulator stayed after the run"
            pkill -9 qemu-system || true
            rc=1
          fi
          exit "$rc"

      # TODO/machine.md T-1656: the microVM of `run --podvm-tier=machine`
      # under KVM, with its times; clause 4 checks that the run takes KVM.
      - name: experiment 412 under KVM
        if: always()
        run: |
          rc=0
          timeout 30m sh experiments/412-microvm-boot.sh || rc=$?
          if pgrep -a qemu-system; then
            echo "an emulator stayed after the run"
            pkill -9 qemu-system || true
            rc=1
          fi
          exit "$rc"

      # TODO/machine.md T-1723: twenty boots of `-M microvm` and of `-M pc`
      # with the pinned kernel under KVM; the binary is the one of 412.
      - name: experiment 440 under KVM
        if: always()
        env:
          PODVM_BIN: ${{ github.workspace }}/target/x86_64-unknown-linux-musl/debug/podvm
        run: |
          rc=0
          timeout 30m sh experiments/440-microvm-machine.sh || rc=$?
          if pgrep -a qemu-system; then
            echo "an emulator stayed after the run"
            pkill -9 qemu-system || true
            rc=1
          fi
          exit "$rc"

      # TODO/gate.md T-1852: the machine section of the QA pass under KVM
      # before each release. The fixture of its rung `ul` needs user
      # namespaces, which AppArmor of Ubuntu 24.04 restricts by default.
      - name: experiment 443, the machine section, under KVM
        if: always()
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          rc=0
          PODVM_443_ONLY=machine \
            PODVM_443_BIN="$GITHUB_WORKSPACE/target/x86_64-unknown-linux-musl/debug/podvm" \
            timeout 40m sh experiments/443-qa-surface.sh || rc=$?
          if pgrep -a qemu-system; then
            echo "an emulator stayed after the run"
            pkill -9 qemu-system || true
            rc=1
          fi
          exit "$rc"

      - name: keep the transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kvm-transcripts
          path: |
            experiments/results/machine-ssh.txt
            experiments/results/microvm-boot.txt
            experiments/results/microvm-machine.txt
            experiments/results/qa-surface.txt
          if-no-files-found: warn

  # TODO/gate.md T-1641, T-1350 and TODO/milestones.md T-1112: the Linux
  # half of experiment 392 (the ValidationOS guest) on a hosted runner with
  # /dev/kvm, the binary of this commit, and the VHDX cut out of the ISO
  # with one range request (its UDF extent: sector 1010, 910163968 bytes;
  # lib/kvm-guest-base.sh pins its digest). One guest at a time: the
  # job runs after the Linux guest, and each step is bounded.
  windows:
    name: ValidationOS guest under KVM (experiment 392, the Linux half)
    needs: guest
    if: always() && (inputs.only == '' || inputs.only == 'windows')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: give the job /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle || true
          [ -e /dev/kvm ] && sudo chmod 0666 /dev/kvm
          if [ -w /dev/kvm ] && [ -r /dev/kvm ]; then
            ls -l /dev/kvm
          else
            echo "no usable /dev/kvm on this runner: COULD NOT RUN"
            exit 2
          fi

      - name: qemu and OVMF
        run: |
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 qemu-utils ovmf >/dev/null
          qemu-system-x86_64 --version | head -1
          ls -l /usr/share/OVMF/OVMF_CODE_4M.fd /usr/share/OVMF/OVMF_VARS_4M.fd

      - name: bootstrap
        run: ./scripts/common/bootstrap-env.sh rust cc zig tools vmtools

      - name: build podvm
        run: |
          cargo build --release -p podvm-gate --bin podvm-interpose-build
          mkdir -p target/release
          cp target/x86_64-unknown-linux-musl/release/podvm-interpose-build target/release/
          ./target/release/podvm-interpose-build
          cargo build --release -p podvm

      - name: the VHDX out of the ISO
        run: |
          mkdir -p "$RUNNER_TEMP/vos"
          URL='https://software-static.download.prss.microsoft.com/dbazure/26100.9278.260824-2119.ge_release_svc_prod3_amd64fre_en-us_VALIDATIONOS.iso'
          start=$((1010 * 2048)); len=910163968
          # lib/kvm-guest-base.sh checks the length and the digest.
          timeout 30m curl -qfsSL --retry 3 -r "$start-$((start + len - 1))" -o "$RUNNER_TEMP/vos/base.vhdx" "$URL"
          ls -l "$RUNNER_TEMP/vos/base.vhdx"

      - name: experiment 392 under KVM
        env:
          PODVM_392_OVMF_CODE: /usr/share/OVMF/OVMF_CODE_4M.fd
          PODVM_392_OVMF_VARS: /usr/share/OVMF/OVMF_VARS_4M.fd
          PODVM_392_LIB: ${{ github.workspace }}/experiments/lib
          PODVM_392_SHOTS: ${{ runner.temp }}/shots
        run: |
          mkdir -p "$PODVM_392_SHOTS"
          {
            echo "PODVM_BIN_SRC=$GITHUB_WORKSPACE/target/x86_64-unknown-linux-musl/release/podvm"
            echo "IMG_HOST=$RUNNER_TEMP/vos/base.vhdx"
            cat experiments/lib/kvm-owned.sh experiments/lib/kvm-guest-base.sh
          } >"$RUNNER_TEMP/guest.sh"
          rc=0
          timeout 65m sh "$RUNNER_TEMP/guest.sh" >experiments/results/kvm-guest-hosted.txt 2>&1 || rc=$?
          cat experiments/results/kvm-guest-hosted.txt
          if pgrep -a qemu-system; then
            echo "an emulator stayed after the run"
            pkill -9 qemu-system || true
            rc=1
          fi
          exit "$rc"

      # TODO/machine.md T-1864, T-1863: podvm fetches the VHDX of build
      # 26100.9818 itself (pod-udf, by range), provisions it, and runs the
      # three exit cases of experiment 450 under KVM.
      - name: experiment 450 under KVM
        if: always()
        run: |
          export HOME="$RUNNER_TEMP/home450"
          mkdir -p "$HOME"
          BIN="$GITHUB_WORKSPACE/target/x86_64-unknown-linux-musl/release/podvm"
          rc=0
          VHDX=$(timeout 30m "$BIN" pull windows:validationos) || rc=$?
          if [ "$rc" -eq 0 ]; then
            PODVM_450_BIN="$BIN" PODVM_450_VHDX="$VHDX" timeout 60m sh experiments/450-windows-agent-exit.sh || rc=$?
          fi
          cat experiments/results/windows-agent-exit.txt.setup 2>/dev/null | tail -20 || true
          if pgrep -a qemu-system; then
            echo "an emulator stayed after the run"
            pkill -9 qemu-system || true
            rc=1
          fi
          exit "$rc"

      - name: keep the transcript
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kvm-windows-transcript
          path: |
            experiments/results/kvm-guest-hosted.txt
            experiments/results/windows-agent-exit.txt
            experiments/results/windows-agent-exit.txt.setup
            ${{ runner.temp }}/shots/
          if-no-files-found: warn

  # TODO/cli.md T-1747: --memory, --cpus and --pids-limit by a delegated
  # cgroup2 subtree (experiment 459). The job makes the layout of a systemd
  # user session: the shell in a writable leaf, under a writable parent
  # that gives memory, cpu and pids to its children. No guest.
  cgroup:
    if: inputs.only == '' || inputs.only == 'cgroup'
    name: cgroup2 limits of a native run (experiment 459)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: bootstrap
        run: ./scripts/common/bootstrap-env.sh rust cc zig tools

      - name: build podvm
        run: |
          cargo build --release -p podvm-gate --bin podvm-interpose-build
          mkdir -p target/release
          cp target/x86_64-unknown-linux-musl/release/podvm-interpose-build target/release/
          ./target/release/podvm-interpose-build
          cargo build --release -p podvm

      - name: experiment 459 in a delegated subtree
        run: |
          set -eu
          D=/sys/fs/cgroup/podvm-ci
          sudo mkdir -p "$D/shell"
          echo "+memory +cpu +pids" | sudo tee /sys/fs/cgroup/cgroup.subtree_control >/dev/null
          echo "+memory +cpu +pids" | sudo tee "$D/cgroup.subtree_control" >/dev/null
          sudo chown -R "$(id -u):$(id -g)" "$D"
          echo $$ | sudo tee "$D/shell/cgroup.procs" >/dev/null
          cat /proc/self/cgroup
          rc=0
          sh experiments/459-cgroup-limits.sh || rc=$?
          exit "$rc"

      - name: keep the transcript
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cgroup-limits
          path: experiments/results/cgroup-limits.txt
          if-no-files-found: warn

  # TODO/machine.md T-1922 (PodUtils/podrunner#195): the machine tier as a
  # user with no root that `sudo -u` makes, beside the user of the runner.
  nonroot:
    if: always() && (inputs.only == '' || inputs.only == 'nonroot')
    name: machine tier as a user with no root (experiment 463)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: give the job /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle || true
          [ -e /dev/kvm ] && sudo chmod 0666 /dev/kvm
          if [ -w /dev/kvm ] && [ -r /dev/kvm ]; then
            ls -l /dev/kvm
          else
            echo "no usable /dev/kvm on this runner: COULD NOT RUN"
            exit 2
          fi

      - name: qemu
        run: |
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 >/dev/null
          qemu-system-x86_64 --version | head -1

      - name: bootstrap
        run: ./scripts/common/bootstrap-env.sh rust cc zig tools

      - name: build podvm
        run: |
          cargo build --release -p podvm-gate --bin podvm-interpose-build
          mkdir -p target/release
          cp target/x86_64-unknown-linux-musl/release/podvm-interpose-build target/release/
          ./target/release/podvm-interpose-build
          cargo build --release -p podvm

      - name: experiment 463
        run: |
          rc=0
          timeout 40m sh experiments/463-machine-nonroot.sh || rc=$?
          if pgrep -a qemu-system; then
            echo "an emulator stayed after the run"
            sudo pkill -9 qemu-system || true
            rc=1
          fi
          exit "$rc"

      - name: keep the transcript
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: machine-nonroot
          path: experiments/results/machine-nonroot.txt
          if-no-files-found: warn

  # TODO/machine.md T-2008, T-2016: the saved state of a guest that booted
  # the init of an image (experiment 468, the routes of the machine tier)
  # under KVM, and the starts of the emulator of the runner with four vCPUs
  # under TCG (experiment 469).
  init:
    if: always() && (inputs.only == '' || inputs.only == 'init')
    name: the saved state of an init guest under KVM (experiments 468 and 469)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: give the job /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle || true
          [ -e /dev/kvm ] && sudo chmod 0666 /dev/kvm
          if [ -w /dev/kvm ] && [ -r /dev/kvm ]; then
            ls -l /dev/kvm
          else
            echo "no usable /dev/kvm on this runner: COULD NOT RUN"
            exit 2
          fi

      - name: qemu and uidmap
        run: |
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 uidmap >/dev/null
          qemu-system-x86_64 --version | head -1
          # The build of experiment 468 runs apt as uid 0 of a user
          # namespace, which the AppArmor of the runner restricts.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          # The build of experiment 468 maps the subordinate range of the user.
          for f in /etc/subuid /etc/subgid; do
            grep -q "^$USER:" "$f" 2>/dev/null || echo "$USER:200000:65536" | sudo tee -a "$f" >/dev/null
          done
          grep "^$USER:" /etc/subuid /etc/subgid

      - name: bootstrap
        run: ./scripts/common/bootstrap-env.sh rust cc zig tools

      - name: build podvm
        run: |
          cargo build --release -p podvm-gate --bin podvm-interpose-build
          mkdir -p target/release
          cp target/x86_64-unknown-linux-musl/release/podvm-interpose-build target/release/
          ./target/release/podvm-interpose-build
          cargo build --release -p podvm

      - name: experiment 465, the routes of an init (run -d, exec, the pty; clauses 10 to 12)
        run: |
          rc=0
          timeout 45m sh experiments/465-init-image.sh || rc=$?
          if pgrep -a qemu-system; then
            echo "an emulator stayed after the run"
            sudo pkill -9 qemu-system || true
            rc=1
          fi
          exit "$rc"

      - name: experiment 468, the routes of the machine tier
        if: always()
        run: |
          rc=0
          sudo env PODVM_468_USER="$USER" PODVM_468_WORK=/var/tmp/podvm-468-ci \
            ROUTES="machine machine-save machine-load" \
            timeout 60m sh experiments/468-init-bench.sh || rc=$?
          if pgrep -a qemu-system; then
            echo "an emulator stayed after the run"
            sudo pkill -9 qemu-system || true
            rc=1
          fi
          exit "$rc"

      - name: experiment 469, the starts of the emulator of the runner under TCG
        if: always()
        run: |
          k=$(sudo sh -c 'ls /var/tmp/podvm-468-ci/store/machine/vmlinuz-* 2>/dev/null | head -1')
          i=$(sudo sh -c 'ls /var/tmp/podvm-468-ci/store/machine/base-*.cpio 2>/dev/null | head -1')
          if [ -z "$k" ] || [ -z "$i" ]; then
            echo "no guest kernel or initrd from experiment 468: COULD NOT RUN"
            exit 2
          fi
          rc=0
          sudo env PODVM_469_KERNEL="$k" PODVM_469_INITRD="$i" PODVM_469_N=200 \
            timeout 40m sh experiments/469-tcg-smp-start.sh || rc=$?
          if pgrep -a qemu-system; then
            sudo pkill -9 qemu-system || true
            rc=1
          fi
          exit "$rc"

      - name: keep the transcripts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: init-state
          path: |
            experiments/results/init-image.txt
            experiments/results/init-bench.txt
            experiments/results/tcg-smp-start.txt
          if-no-files-found: warn

  # TODO/probe.md T-1907: under QEMU user mode the open of /dev/kvm and its
  # ioctls reach the x86_64 device, which runs no aarch64 guest. An aarch64
  # podvm on this x86_64 runner with /dev/kvm must say no, with the reason.
  arch:
    if: inputs.only == '' || inputs.only == 'arch'
    name: aarch64 podvm under QEMU user mode on an x86_64 KVM host (T-1907)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: give the job /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle || true
          [ -e /dev/kvm ] && sudo chmod 0666 /dev/kvm
          if [ -w /dev/kvm ] && [ -r /dev/kvm ]; then
            ls -l /dev/kvm
          else
            echo "no usable /dev/kvm on this runner: COULD NOT RUN"
            exit 2
          fi

      - name: qemu user mode
        run: |
          sudo apt-get -qq update
          # Run 43740331439: the runner image has no qemu-user-static; the
          # package qemu-user gives a static qemu-aarch64 there.
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-user-static >/dev/null 2>&1 ||
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-user >/dev/null
          Q=$(command -v qemu-aarch64-static || command -v qemu-aarch64)
          echo "Q=$Q" >> "$GITHUB_ENV"
          "$Q" --version | head -1

      - name: bootstrap
        run: ./scripts/common/bootstrap-env.sh rust cc zig tools

      - name: build podvm (aarch64, cross)
        run: |
          rustup target add aarch64-unknown-linux-gnu aarch64-unknown-linux-musl
          cargo build --release -p podvm-gate --bin podvm-interpose-build
          mkdir -p target/release
          cp target/x86_64-unknown-linux-musl/release/podvm-interpose-build target/release/
          TARGETS="aarch64-unknown-linux-gnu aarch64-unknown-linux-gnu+glibc2.34 aarch64-unknown-linux-musl" ./target/release/podvm-interpose-build
          cargo build --release --target aarch64-unknown-linux-musl -p podvm

      - name: the probe says no KVM, with the reason
        run: |
          set -u
          B=target/aarch64-unknown-linux-musl/release/podvm
          rows=$("$Q" "$B" probe --rows 2>&1) || true
          printf '%s\n' "$rows" | grep -i kvm || true
          if printf '%s\n' "$rows" | grep -F 'open(/dev/kvm, O_RDWR)' | grep -qw PASS; then
            echo "FAIL: the aarch64 probe says yes for the x86_64 device"
            exit 1
          fi
          printf '%s\n' "$rows" | grep -F 'open(/dev/kvm, O_RDWR)' | grep -q 'FAIL' || { echo "FAIL: no kvm row"; exit 1; }
          rc=0
          out=$(PODVM_MACHINE_ACCEL=kvm timeout 300 "$Q" "$B" run --rm --podvm-tier=machine \
            public.ecr.aws/docker/library/alpine:3.20 true 2>&1) || rc=$?
          printf '%s\n' "$out" | tail -5
          echo "exit=$rc"
          printf '%s\n' "$out" | grep -q 'does not fall back to TCG' || { echo "FAIL: the machine tier took the device"; exit 1; }
          echo PASS

  # TODO/machine.md T-1867: `podvm pull windows:2025` installs the setup
  # ISO into a golden image under KVM (experiment 452). The clause of a
  # host with TCG only runs first, while the job has no /dev/kvm. One
  # guest at a time: the job runs after the ValidationOS guest.
  #
  # Run 43689812413 stopped at "56% complete" for 2 h with no write to the
  # disk. Three legs, each on its own runner with one guest, tell the
  # suspects apart: the QEMU of Ubuntu (8.2), podvm's pinned static QEMU
  # (9.2, from the store), and the QEMU of Ubuntu with no Hyper-V flags.
  install:
    name: Windows install under KVM (experiment 452, ${{ matrix.leg }})
    needs: windows
    if: always() && (inputs.only == '' || inputs.only == 'install')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          # Run 43709734103: the three legs stalled or failed alike
          # ("Windows Server installation has failed"), so the QEMU and
          # the Hyper-V flags are not the cause. One leg, with the logs
          # of Setup.
          - leg: ubuntu-qemu
            apt_qemu: "1"
            hyperv: "1"
            root_bus: nvme
          # Run 43767666467: the emulator went idle at 2.14 GB read of the
          # ISO (CPU near 7% from minute 20), with 4096 MiB and 2 CPUs.
          - leg: ubuntu-qemu-8g
            apt_qemu: "1"
            hyperv: "1"
            root_bus: nvme
            install_mem: 8G
            install_cpus: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: qemu and OVMF
        if: matrix.apt_qemu == '1'
        run: |
          sudo apt-get -qq update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 qemu-utils ovmf >/dev/null
          qemu-system-x86_64 --version | head -1

      - name: bootstrap
        run: ./scripts/common/bootstrap-env.sh rust cc zig tools vmtools

      - name: build podvm
        run: |
          cargo build --release -p podvm-gate --bin podvm-interpose-build
          mkdir -p target/release
          cp target/x86_64-unknown-linux-musl/release/podvm-interpose-build target/release/
          ./target/release/podvm-interpose-build
          cargo build --release -p podvm

      # The ISO, the written disk and its converted copy need about 60 GB.
      - name: room for the install
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo mkdir -p /mnt/w && sudo chown "$(id -u):$(id -g)" /mnt/w
          df -h / /mnt

      # The refusal names the QEMU of PATH; the leg of the store has none.
      - name: experiment 452, the refusal under TCG
        if: matrix.apt_qemu == '1'
        env:
          HOME: /mnt/w/home-refusal
        run: |
          mkdir -p "$HOME"
          PODVM_452_REFUSAL=1 sh experiments/452-windows-install.sh

      - name: give the job /dev/kvm
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle || true
          [ -e /dev/kvm ] && sudo chmod 0666 /dev/kvm
          if [ -w /dev/kvm ] && [ -r /dev/kvm ]; then
            ls -l /dev/kvm
          else
            echo "no usable /dev/kvm on this runner: COULD NOT RUN"
            exit 2
          fi

      - name: experiment 452 under KVM
        env:
          HOME: /mnt/w/home
          PODVM_452_NAMES: ${{ inputs.windows || '2025' }}
          PODVM_WINDOWS_SHOTS: ${{ runner.temp }}/install-shots
          PODVM_WINDOWS_HYPERV: ${{ matrix.hyperv }}
          PODVM_WINDOWS_KEEP_FAILED: /mnt/w/failed
          PODVM_WINDOWS_ROOT_BUS: ${{ matrix.root_bus }}
          PODVM_WINDOWS_ISO_BUS: ${{ matrix.iso_bus }}
          PODVM_WINDOWS_INSTALL_MEM: ${{ matrix.install_mem }}
          PODVM_WINDOWS_INSTALL_CPUS: ${{ matrix.install_cpus }}
        run: |
          mkdir -p "$HOME" "$RUNNER_TEMP/install-shots"
          # Run 43754060132: the ISO on a USB CD stopped as on IDE, and the
          # root on SATA as on NVMe (1.53 GiB on the disk from minute 5).
          # Each 5 min: the CPU ticks and the I/O bytes of the emulator,
          # and the size of the root disk: a busy emulator with no I/O is
          # the guest; an idle one waits on a request.
          (
            while sleep 300; do
              p=$(pgrep -o qemu-system) || continue
              t=$(awk '{print $14 + $15}' "/proc/$p/stat")
              io=$(grep -E '^(rchar|wchar|read_bytes|write_bytes)' "/proc/$p/io" | tr '\n' ' ')
              d=$(find /mnt/w/home -name '*.qcow2' -size +100M -printf '%s\n' 2>/dev/null | sort -n | tail -1)
              echo "$(date -u +%H:%M) cpu-ticks $t $io disk ${d:--}"
            done
          ) > "$RUNNER_TEMP/install-shots/qemu-sample.txt" 2>&1 &
          SAMPLER=$!
          rc=0
          timeout 200m sh experiments/452-windows-install.sh || rc=$?
          kill "$SAMPLER" 2>/dev/null || true
          cat "$RUNNER_TEMP/install-shots/qemu-sample.txt" || true
          if pgrep -a qemu-system; then
            echo "an emulator stayed after the run"
            pkill -9 qemu-system || true
            rc=1
          fi
          exit "$rc"

      # The logs of Setup on the kept root disk of a failed install
      # (setupact.log and setuperr.log of each Panther directory).
      # Run 43783602911: the error is not on the root disk. WinPE copies
      # its logs (X:\Windows\Panther, X:\$Windows.~BT) each 30 s to the
      # log stick (podvm_windows::pelogs); the job keeps the image file
      # and its files (FAT16, partition at 1 MiB) in winpe/.
      - name: the logs of Setup
        if: failure()
        run: |
          set -u
          mkdir -p "$RUNNER_TEMP/install-shots/panther" "$RUNNER_TEMP/install-shots/winpe"
          if [ -f /mnt/w/failed/pelogs.img ]; then
            cp /mnt/w/failed/pelogs.img "$RUNNER_TEMP/install-shots/winpe/pelogs.img"
            sudo mkdir -p /mnt/pelogs
            if sudo mount -t vfat -o loop,ro,offset=1048576 /mnt/w/failed/pelogs.img /mnt/pelogs; then
              sudo cp -r /mnt/pelogs/. "$RUNNER_TEMP/install-shots/winpe/" || true
              sudo umount /mnt/pelogs
            else
              echo "the log stick does not mount"
            fi
            sudo chmod -R a+rX "$RUNNER_TEMP/install-shots/winpe"
            ls -laR "$RUNNER_TEMP/install-shots/winpe"
          else
            echo "no kept log stick"
          fi
          [ -f /mnt/w/failed/root.qcow2 ] || { echo "no kept disk"; exit 0; }
          sudo modprobe nbd max_part=8 || true
          sudo qemu-nbd --read-only --connect=/dev/nbd0 /mnt/w/failed/root.qcow2
          sleep 3
          lsblk /dev/nbd0 || true
          for p in /dev/nbd0p*; do
            d=/mnt/p$(basename "$p")
            sudo mkdir -p "$d"
            sudo mount -t ntfs3 -o ro "$p" "$d" 2>/dev/null || continue
            sudo find "$d" -maxdepth 6 -ipath '*panther*' \( -iname 'setup*.log' -o -iname '*.xml' \) 2>/dev/null |
              while read -r f; do
                n=$(echo "$f" | tr '/ ' '__')
                sudo cp "$f" "$RUNNER_TEMP/install-shots/panther/$n"
              done
            sudo umount "$d"
          done
          sudo qemu-nbd --disconnect /dev/nbd0 || true
          sudo chmod -R a+r "$RUNNER_TEMP/install-shots/panther"
          ls -la "$RUNNER_TEMP/install-shots/panther"

      - name: keep the transcript
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kvm-install-transcript-${{ matrix.leg }}
          path: |
            experiments/results/windows-install.txt
            experiments/results/windows-install-*.err
            ${{ runner.temp }}/install-shots/
          if-no-files-found: warn
