[package]
name = "podvm-interpose"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "0BSD"
repository = "https://github.com/PodUtils/podvm"

# ⛔ Not a workspace member (see the root Cargo.toml). This object is loaded
# into other people's processes: it takes no dependency on the rest of the tree
# and none on anything that allocates on an interposed path (TOOL.md section 6.7).
# Its one dependency is `pod-beneath`: `no_std`, no allocation, no symbol of
# its own, and the system calls of this object (`map/base.rs`, `Raw`).

[lib]
name = "podvm_interpose"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
# TODO/deps.md T-2050 (PodUtils/podvm#611): the open of a volume under
# `PODVM_VOLUME_BASE`. With the feature `libc` off: this object exports
# `syscall` itself, so the crate takes the raw calls of `raw_calls`.
pod-beneath = { git = "https://github.com/PodUtils/podcrates", tag = "v0.83.0", default-features = false }

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
strip = "symbols"
panic = "abort"
