[package]
name = "podvm-enter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
podvm-probe = { path = "../podvm-probe" }
# The entry of a payload (the chroot sequence, the namespace rung, the
# entry with no chroot, the launch ladder, the reader of ELF files), shared
# through PodUtils/podcrates. This crate gives podvm's names to it.
pod-enter = { git = "https://github.com/PodUtils/podcrates", tag = "v0.86.0" }
# The class of a runtime error that podvm makes (`runtime`).
pod-core = { git = "https://github.com/PodUtils/podcrates", tag = "v0.86.0", default-features = false }
# The confinement of a payload (Landlock, a seccomp deny filter and
# no_new_privs; TODO/enter.md T-1658).
pod-confine = { git = "https://github.com/PodUtils/podcrates", tag = "v0.86.0" }
# TODO/enter.md T-2101: the user namespace and the system calls of an
# overlay volume, and the open of its lower layer under a volume base.
pod-hostprobe = { git = "https://github.com/PodUtils/podcrates", tag = "v0.86.0" }
pod-beneath = { git = "https://github.com/PodUtils/podcrates", tag = "v0.86.0" }

# TODO/enter.md T-2101: a test with its own `main`, so that the process has
# one thread and can enter a user namespace.
[[test]]
name = "overlay_layer"
harness = false
